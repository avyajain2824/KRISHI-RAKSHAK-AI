L=layer(c,'river');a=c.createGain();a.gain.value=.5;chain(c,nz(c,1),[flt(c,'lowpass',900),a],L);
a=c.createGain();a.gain.value=.05;chain(c,nz(c),[flt(c,'bandpass',1700,.9),a],L);lfo(c,.37,.025,a.gain);lfo(c,.83,.02,a.gain);

<div class="wx">${tile(T('totc'),fm(all.cost))}${tile(T('rev'),fm(all.rev))}${tile(all.profit>=0?T('pft'):T('los'),fm(Math.abs(all.profit)),pc(all.profit))}</div></div>
<div class="card"><h2>${T('addf')}</h2><div class="grid" style="gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div><label for="nf">${T('fname')}</label><input type="text" id="nf"></div><div><label for="nfc">${T('crop')}</label><select id="nfc">${cropOpts()}</select></div><div><label for="nfa">${T('ac')}</label><input type="number" id="nfa" min="0.1" step="0.1" value="1"></div></div><div class="row"><button id="af">${T('addf')}</button></div></div>
${ff?plView(ff):''}
${d.fields.length>1?`<div class="card"><h2>${T('cmp')}</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><tr style="text-align:left"><th>${T('fld')}</th><th>${T('ac')}</th><th>${T('totc')}</th><th>${T('rev')}</th><th>${T('pft')}</th></tr>${d.fields.map(f=>{const x=pl(f.id);return `<tr style="border-top:1px solid var(--bd)"><td>${C[f.crop][1]} ${esc(f.name)}</td><td>${f.acres}</td><td>${fm(x.cost)}</td><td>${fm(x.rev)}</td><td style="color:${pc(x.profit)};font-weight:700">${fm(x.profit)}</td></tr>`}).join('')}</table></div></div>`:''}`},
profile(){const d=dd(),p=d.pf,a=pl(),c=credit(),t=tcalc(),inp=(k,l,ty,x)=>`<div><label for="pf_${k}">${l}</label><input type="${ty}" id="pf_${k}" value="${esc(hv(p[k])?p[k]:'')}" ${x||''}></div>`,sel=(k,l,o)=>`<div><label for="pf_${k}">${l}</label><select id="pf_${k}"><option value="">—</option>${o.map(([v,n])=>`<option value="${v}" ${p[k]==v?'selected':''}>${n}</option>`).join('')}</select></div>`,g='style="gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"';
const ready=a.ac>0&&hv(p.lat)&&hv(p.lon);
return `<div class="card"><h2>🏦 ${T('pfh')}</h2><p class="mut">${T('prnote')}</p>
<div class="grid" ${g}>${inp('loc','Village / district','text')}${inp('yrs','Years farming','number','min="0"')}${sel('irr','Irrigation',[['rain','Rainfed'],['part','Partial'],['full','Full']])}${sel('ins',T('ins'),[['yes','Yes'],['no','No']])}${inp('loan',T('loan')+' ('+d.cur+')','number','min="0" step="any"')}</div></div>
<div class="card"><h3>${T('soil')}</h3><div class="grid" ${g}>${inp('ph','Soil pH','number','min="0" max="14" step="0.1"')}${inp('oc','Organic carbon (%)','number','min="0" step="0.1"')}${sel('npk','Nutrients (N-P-K)',[['low',T('lo')],['med',T('mi')],['high',T('hg')]])}</div><p class="mut" style="font-size:.85rem">${T('soilnote')}</p></div>
<div class="card"><h3>📍 ${T('sat')}</h3><div class="grid" ${g}>${inp('lat','Farm GPS latitude','number','step="any"')}${inp('lon','Farm GPS longitude','number','step="any"')}</div><div class="row"><button class="alt" id="gpb">📍 Use my location</button></div>
<div class="box ${ready?'':'warn'}"><b>${ready?T('satok'):T('satno')}</b><br><span class="mut">${T('satnote')}</span></div></div>
<div class="card"><h3>${T('yh')}</h3>${d.fields.length?d.fields.map(f=>{const x=pl(f.id);return `<div class="rec" style="grid-template-columns:40px 1fr auto"><span style="font-size:1.6rem">${C[f.crop][1]}</span><div><b>${esc(f.name)}</b><br><span class="mut">${C[f.crop][0]} · ${f.acres} ${T('ac')}</span></div><b>${x.kg?f1(x.kg/f.acres)+' kg/'+T('ac'):'—'}</b></div>`}).join(''):noField()}</div>
<div class="card"><div class="ch"><h3 style="margin:0">${T('score')}</h3><span class="tag">${T('illus')}</span></div>
<div class="hl"><div><div class="hs" style="color:${c.tot>=70?'var(--g)':c.tot>=45?'var(--wn)':'#c0392b'}">${c.tot}<small>/100</small></div><b>${T(c.band)}</b></div><div>${c.P.map(x=>`<div style="display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;margin:5px 0"><span>${x.l}</span><div class="bar" style="margin:0"><i style="width:${x.s/x.m*100}%;background:var(--g)"></i></div><span class="mut">${x.s}/${x.m}</span></div>`).join('')}</div></div>
<h3 style="margin-top:14px">${T('how')}</h3><ul>${c.P.filter(x=>x.s<x.m).map(x=>`<li>${x.tip}</li>`).join('')||`<li>✓</li>`}</ul>
<h3>${T('sug')}</h3><ul><li>${T('s1')}</li><li>${T('s2')}</li>${c.tot>=45?`<li>${T('s3')}</li>`:''}${st.reg=='in'?`<li>${T('s4')}</li>`:''}</ul></div>
<div class="card"><h3>${T('copy')}</h3><textarea id="sumbox" readonly style="min-height:200px">${esc(sumText())}</textarea><div class="row"><button id="cpb">${T('copy')}</button></div></div>`},
carbon(){const d=dd(),t=tcalc();
return `<div class="card"><h2>🌍 ${T('carb')}</h2><p class="mut">${T('cnote')}</p>
<div class="grid" style="gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><div><label for="cb_p">Carbon price (US$ per tonne)</label><input type="number" id="cb_p" min="0" step="any" value="${d.cb.price}"></div><div><label for="cb_s">Farmer’s share (%)</label><input type="number" id="cb_s" min="0" max="100" step="1" value="${d.cb.share}"></div></div>
<div class="wx">${tile(T('co2e'),f1(t.lo)+'–'+f1(t.hi))}${tile(T('cval'),'US$ '+Math.round(t.vlo).toLocaleString()+'–'+Math.round(t.vhi).toLocaleString())}${tile(T('sscore'),t.score+'/100',t.score>=50?'var(--g)':'')}</div></div>
${d.fields.length?d.fields.map(f=>`<div class="card"><h3>${C[f.crop][1]} ${esc(f.name)} · ${f.acres} ${T('ac')}</h3><div class="row" role="group" aria-label="${esc(f.name)}">${PRAC.map(([k,l])=>`<button class="chip" data-pr="${f.id}|${k}" aria-pressed="${!!(f.pr&&f.pr[k])}">${T(l)}</button>`).join('')}</div></div>`).join(''):noField()}
<div class="card"><h3>${T('alog')}</h3>${d.log.length?d.log.slice(0,12).map(e=>`<div style="display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:6px 0;border-top:1px solid var(--bd)"><span class="mut">${e.d}</span><span>${esc(e.f)} · ${T((PRAC.find(x=>x[0]==e.p)||[0,'c_oth'])[1])}</span><b>${e.on?'✓ on':'off'}</b></div>`).join(''):`<p class="mut">${T('none2')}</p>`}</div>`},
assistant(){const ap=T('ap').split('|'),im=st.lim&&st.lim.images;return `<div class="card"><div class="ch"><h2 style="margin:0">🤖 ${T('asst')}</h2><button class="alt" id="acl">${T('aclr')}</button></div><p class="mut">${T('asub')}</p>${st.ai?'':`<div class="box warn">${T('aoff')}</div>`}
<div class="log" id="alog" aria-live="polite">${st.chat.length?st.chat.map(msgHTML).join(''):`<div class="row">${ap.map((x,i)=>`<button class="chip" data-ap="${i}">${esc(x)}</button>`).join('')}</div>`}</div>
${st.pimg?`<div class="row"><span class="tag">📷 ${esc(st.pimg.name)}</span></div>`:''}
<textarea id="aq" aria-label="${T('aph')}" placeholder="${T('aph')}"></textarea>
<div class="row">${im?`<button class="alt" id="apb">📷 ${T('aatt')}</button><input type="file" id="apic" accept="${im.mediaTypes.join(',')}" hidden>`:''}<button id="as" ${st.busy?'disabled':''}>${T('asend')}</button>${st.busy?`<button class="alt" id="ast">${T('astop')}</button>`:''}</div>
<p class="mut" style="font-size:.85rem">${T('anote')}</p></div>`},
map(){return mapHTML()},
home(){return `<div class="card"><h2>${T('hi').replace('Farm Singh',esc(st.user.name))}</h2><p class="mut">${T('dash')}</p></div>
${wxHTML()}
<div class="tiles">${PAGES.slice(1).map(p=>`<a class="tile" href="#${p[0]}"><span>${p[1]}</span><b>${T(p[2])}</b></a>`).join('')}</div>
<div class="card"><h2>${T('recent')}</h2>${histHTML()}</div>`},
scan(){const c=C[st.crop],p=cur();return `<div class="narrow"><div class="card"><h2>${T('up')}</h2><p class="mut">${T('upd')}</p>
<label for="cs">${T('crop')}</label><select id="cs">${cropOpts()}</select>
<div class="drop" style="margin-top:14px">${st.img?`<div><img src="${st.img}" alt="Uploaded leaf"><br><small class="mut">${esc(st.fn)}</small></div>`:'📷'}</div>
<label for="ph">${T('photo')}</label><input type="file" id="ph" accept="image/*" capture="environment">
<label for="nt">${T('see')}</label><textarea id="nt"></textarea>
<div class="box">${T('lighting')}</div><button id="go">${T('go')}</button></div>
${st.res===null?'':`<div id="out" class="card" style="margin-top:20px"><h2>${T('ai')}</h2><div class="box"><b style="color:var(--g)">${T('notdx')}</b></div>
<p>${T('conf')}: <b>${st.res===-1?T('low'):T('med')}</b></p>
${st.res===-1?`<div class="box warn"><b>${T('unsure')}</b></div>`:`<small class="mut">${T('likely')}</small><div class="big">${esc(p[0])}</div><div class="box"><small>${T('cause')}</small>${p[1]}</div><div class="box"><small>${T('look')}</small>${p[2]}</div><div class="box"><small>${T('cond')}</small>${p[3]}</div><div class="box"><small>${T('act')}</small><ul>${p[4].map(a=>`<li>${a}</li>`).join('')}</ul></div><div class="row"><a class="btn" href="#calc">🧮 ${T('calc')}</a><a class="btn alt" href="#suppliers">📍 ${T('sup')}</a></div>`}
<p class="mut">${T('nopest')}</p></div>`}</div>`},
calc(){const ps=C[st.crop][2],r=calc();return `<div class="narrow"><div class="card"><h2>${T('calc')}</h2>
<label for="cs">${T('crop')}</label><select id="cs">${cropOpts()}</select>
<label for="ps">${T('prob')}</label><select id="ps">${ps.map((x,i)=>`<option value="${i}" ${i==st.cp?'selected':''}>${esc(x[0])}</option>`).join('')}</select>
<label for="ar">${T('area')}</label><input type="number" id="ar" min="0.1" step="0.1" value="${st.area}">
<label for="sv">${T('sev')}</label><select id="sv">${['Mild','Moderate','Severe'].map(x=>`<option value="${x}" ${x==st.sev?'selected':''}>${T(x)}</option>`).join('')}</select>
<div class="box"><small>${T('loss')}</small><div class="big">${r[0]}–${r[1]}%</div><span class="mut">${T('est')}</span></div></div></div>`},
crops(){const c=C[st.pc];return `<div class="card"><h2>${T('choose')}</h2><div class="row" role="group" aria-label="Crop">${Object.entries(C).map(([k,v])=>`<button class="chip" data-pc="${k}" aria-pressed="${k==st.pc}">${v[1]} ${v[0]}</button>`).join('')}</div>
<p class="mut">${c[0]}: ${c[2].length} common problems. Each shows the cause, symptoms, conditions that favour it and what you can do. This is general guidance, so confirm locally.</p></div><div class="grid">${c[2].map(p=>prob(p)).join('')}</div>`},
suppliers(){return `<div class="card"><h2>${T('sup')}</h2><p class="mut">Find certified seed, fertilizer, tools and authorized crop-protection products. Sample listings, so replace with local dealers.</p></div><div class="grid">${SUP.map(s=>`<div class="card"><h3>${s.n} ${s.v?'<span class="tag">✓ Verified</span>':''}</h3><p class="mut">${s.d} · ${s.h}<br>Farmer rating: ${s.r} / 5</p><div class="row"><a class="btn" href="tel:${s.t}">📞 ${T('call')}</a><button class="alt" data-stock="${s.n}">${T('stock')}</button></div></div>`).join('')}</div>`}};
function render(){const au=!!st.user,h=(location.hash||'#home').slice(1),k=au?(V[h]?h:'home'):'login';
$('.shell').classList.toggle('solo',!au);$('#nav').hidden=!au;
if(au)$('#nav').innerHTML=PAGES.map(p=>`<a href="#${p[0]}" ${p[0]==k?'aria-current="page"':''}>${p[1]} ${T(p[2])}</a>`).join('')+`<div class="prof"><i>${esc(st.user.name.trim().slice(0,2).toUpperCase())}</i><div>${esc(st.user.name)}<br>••••${st.user.mob.slice(-4)}</div></div>`;
$('#app').innerHTML=au?V[k]():loginHTML();
$('#hu').innerHTML=au?`<button class="alt" id="lo" style="min-height:42px;padding:8px 14px;margin-left:8px">${T('out')}</button>`:'';
$('#ht').textContent=T('dash');$('#lg').value=st.lang;$('#pf').innerHTML=prefHTML();document.documentElement.lang=st.lang;document.title='KrishiRakshak AI – '+k;sndUI();const lg=$('#alog');if(lg)lg.scrollTop=lg.scrollHeight}
function analyse(){const nt=($('#nt').value||'').toLowerCase(),ps=C[st.crop][2];let best=-1,sc=0;ps.forEach((p,i)=>{const s=p[6].split(' ').filter(w=>nt.includes(w)).length;if(s>sc){sc=s;best=i}});
if(!st.img&&nt.trim().length<4){toast('Add a photo or describe the symptoms');return}
st.res=sc>=1?best:-1;if(st.res>=0){st.cp=st.res;const p=ps[st.res];st.hist.unshift({c:C[st.crop][0],i:C[st.crop][1],p:p[0],cf:'Medium',l:Math.round((p[5][0]+p[5][1])/2),t:new Date().toLocaleString()});st.hist=st.hist.slice(0,5);try{localStorage.setItem('agr-hist',JSON.stringify(st.hist))}catch(e){}}render();const o=$('#out');if(o)o.scrollIntoView({behavior:'smooth'})}
document.addEventListener('click',e=>{const lc=e.target.closest('[data-loc]');if(lc){selLoc(+lc.dataset.loc);return}const t=e.target.closest('button');if(!t)return;if(t.dataset.pc){st.pc=t.dataset.pc;render()}else if(t.dataset.stock)toast('Stock check sent to '+t.dataset.stock);else if(t.id=='af')addField();else if(t.id=='axc')addCost();else if(t.id=='axs')addSale();else if(t.dataset.del)delEntry(t.dataset.del);else if(t.dataset.pr)togglePr(t.dataset.pr);else if(t.id=='gpb')useGps();else if(t.id=='cpb')copySum();else if(t.id=='as')ask();else if(t.id=='ast'){if(st.ctl)st.ctl.abort()}else if(t.id=='acl'){if(st.ctl)st.ctl.abort();st.chat=[];st.pimg=null;st.busy=false;render()}else if(t.id=='apb'){$('#apic').click()}else if(t.dataset.ap!=null){const x=$('#aq');if(x)x.value=T('ap').split('|')[+t.dataset.ap];ask()}else if(t.id=='sm')toggleSound();else if(t.dataset.sl)setLayer(t.dataset.sl);else if(t.id=='lgo')doAuth();else if(t.id=='vgo')doVerify();else if(t.id=='vcan'){st.pend=null;render()}else if(t.id=='lo')logout();else if(t.dataset.lm){st.lm=t.dataset.lm;render()}else if(t.id=='rf'){refreshWx();render()}else if(t.id=='go'){const n=$('#nt').value;analyse();const x=$('#nt');if(x)x.value=n}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='pt'||t.id=='pz'||t.id=='pn'||t.id=='pp'){if(t.id=='pp')pf.pal=t.value;if(t.id=='pt')pf.th=t.value;if(t.id=='pz')pf.fs=t.value;if(t.id=='pn')pf.ff=t.value;try{localStorage.setItem('agr-pref',JSON.stringify(pf))}catch(x){}applyPrefs()}else if(t.id=='fs'){st.ff=t.value;render()}else if(t.id=='cu'){dd().cur=t.value;sv();render()}else if(t.id&&t.id.indexOf('pf_')==0)pfSet(t);else if(t.id=='cb_p'||t.id=='cb_s')cbSet(t);else if(t.id=='rg'){st.reg=t.value;st.loc=0;syncWx();render()}else if(t.id=='lg'){st.lang=t.value;try{localStorage.setItem('agr-lang',t.value)}catch(x){}render()}else if(t.id=='ps'){st.cp=+t.value;render()}else if(t.id=='cs'){st.crop=t.value;st.res=null;st.cp=0;render()}else if(t.id=='sv'){st.sev=t.value;render()}else if(t.id=='ar'){st.area=Math.max(.1,+t.value||1);render()}else if(t.id=='apic'){st.pimg=t.files[0]||null;keepInput(render)}else if(t.id=='ph'&&t.files[0]){st.fn=t.files[0].name;const r=new FileReader();r.onload=()=>{st.img=r.result;const n=$('#nt').value;render();$('#nt').value=n};r.readAsDataURL(t.files[0])}});
document.addEventListener('input',e=>{if(e.target.id=='sv')setVol(+e.target.value)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key=='Enter'&&/^(lnm|lmob|lpin|vc)$/.test(t.id)){e.preventDefault();const b=$(t.id=='vc'?'#vgo':'#lgo');if(b)b.click()}else if(e.key=='Enter'&&!e.shiftKey&&t.id=='aq'){e.preventDefault();ask()}else if((e.key=='Enter'||e.key==' ')&&t.matches&&t.matches('g[data-loc]')){e.preventDefault();selLoc(+t.dataset.loc)}});
addEventListener('hashchange',render);applyPrefs();render();
</script></body></html>
